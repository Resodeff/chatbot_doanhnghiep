{% load static %}
<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Linh Kiện PC</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("lkpc-theme");
    if (!t) {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* kệ, giữ mặc định light */ }
})();
</script>
<link rel="stylesheet" href="{% static 'LinhKienMay/css/store.css' %}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'home' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
        <rect x="10" y="10" width="4" height="4"></rect>
        <path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path>
      </svg>
      <span>Linh Kiện PC<small>Cửa hàng linh kiện máy tính</small></span>
    </a>
    <div class="header-spacer"></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Chuyển sang giao diện tối" aria-pressed="false" title="Đổi giao diện sáng / tối">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Đăng nhập</h1>
      <p class="sub">Đăng nhập để chatbot nhớ các bộ PC bạn đã build.</p>
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        {{ form.as_p }}
        <button type="submit">Đăng nhập</button>
      </form>
      <p class="auth-switch">Chưa có tài khoản? <a href="{% url 'dang_ky' %}">Đăng ký</a></p>
    </div>
  </div>
</div>

<script src="{% static 'LinhKienMay/js/store.js' %}" defer></script>
</body>
</html>
